<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Scanner Demo</title>

  <!-- Barcode/QR scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Barcode generator -->
  <script src="https://cdn.jsdelivr.net/npm/bwip-js@4.5.1/dist/bwip-js-min.js"></script>

  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 16px;
      background: #111;
      color: #fff;
    }

    h2 {
      margin-top: 0;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0;
    }

    button, select {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #22c55e;
      color: #08110a;
      font-weight: 700;
    }

    button:disabled {
      opacity: 0.5;
    }

    #stop {
      background: #ef4444;
      color: white;
    }

    #reader {
      width: 100%;
      max-width: 700px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    #output {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #181818;
      max-width: 700px;
    }

    canvas {
      background: white;
      border-radius: 12px;
      max-width: 100%;
      margin-top: 12px;
    }

    .small {
      color: #aaa;
      font-size: 13px;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <h2>Camera Card Scanner Demo</h2>

  <div class="row" id="controls">
    <select id="camera"></select>
    <button id="start">Start Camera</button>
    <button id="stop" disabled>Stop</button>
  </div>

  <div id="reader"></div>

  <div id="output" hidden>
    <p><b>Detected format:</b> <span id="format"></span></p>
    <p><b>Rendered as:</b> <span id="bcid"></span></p>
    <p class="small"><b>Value:</b> <span id="value"></span></p>

    <canvas id="barcode"></canvas>

    <p class="small">
      Turn screen brightness to maximum and present this code to the scanner.
    </p>

    <button id="again">Scan Again</button>
  </div>

  <script>
    let scanner = null;
    let scanning = false;

    const supportedFormats =
      typeof Html5QrcodeSupportedFormats !== "undefined"
        ? Object.values(Html5QrcodeSupportedFormats).filter(v => typeof v === "number")
        : [];

    const formatMap = {
      QRCODE: "qrcode",
      CODE128: "code128",
      CODE39: "code39",
      CODE93: "code93",
      EAN13: "ean13",
      EAN8: "ean8",
      UPCA: "upca",
      UPCE: "upce",
      DATAMATRIX: "datamatrix",
      PDF417: "pdf417",
      ITF: "interleaved2of5",
      CODABAR: "codabar"
    };

    function normalizeFormat(name) {
      return (name || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    }

    function getFormatName(decodedResult) {
      try {
        const f = decodedResult?.format;
        if (!f) return "UNKNOWN";
        if (typeof f === "string") return f;
        return f.formatName || f.name || f.toString() || "UNKNOWN";
      } catch {
        return "UNKNOWN";
      }
    }

    function chooseBcid(formatName, text) {
      const n = normalizeFormat(formatName);

      if (formatMap[n]) return formatMap[n];

      if (n.includes("QR")) return "qrcode";
      if (n.includes("128")) return "code128";
      if (n.includes("39")) return "code39";
      if (n.includes("93")) return "code93";
      if (n.includes("EAN13")) return "ean13";
      if (n.includes("EAN8")) return "ean8";
      if (n.includes("UPC")) return "upca";
      if (n.includes("PDF")) return "pdf417";
      if (n.includes("DATA")) return "datamatrix";

      if (/^https?:/i.test(text)) return "qrcode";

      return "code128";
    }

    function render(text, formatName) {
      document.getElementById("format").textContent = formatName;
      document.getElementById("value").textContent = text;

      const bcid = chooseBcid(formatName, text);
      document.getElementById("bcid").textContent = bcid;

      const canvas = document.getElementById("barcode");

      const is2D = ["qrcode", "datamatrix", "pdf417", "azteccode"].includes(bcid);

      const options = {
        bcid,
        text,
        scale: is2D ? 4 : 3,
        backgroundcolor: "FFFFFF",
        padding: 10
      };

      if (!is2D) {
        options.includetext = true;
        options.textxalign = "center";
        options.height = 18;
      }

      if (bcid === "qrcode") {
        options.eclevel = "M";
      }

      try {
        bwipjs.toCanvas(canvas, options);
      } catch (e) {
        alert("Could not render barcode: " + e.message);
      }

      document.getElementById("reader").hidden = true;
      document.getElementById("controls").hidden = true;
      document.getElementById("output").hidden = false;
    }

    async function start() {
      if (scanning) return;

      try {
        document.getElementById("output").hidden = true;
        document.getElementById("reader").hidden = false;
        document.getElementById("controls").hidden = false;

        if (scanner) {
          try {
            scanner.clear();
          } catch {}
        }

        const cameras = await Html5Qrcode.getCameras();
        const select = document.getElementById("camera");

        if (select.options.length === 0) {
          cameras.forEach((cam, i) => {
            const opt = document.createElement("option");
            opt.value = cam.id;
            opt.textContent = cam.label || `Camera ${i + 1}`;
            select.appendChild(opt);
          });
        }

        scanner = new Html5Qrcode("reader", {
          formatsToSupport: supportedFormats,
          rememberLastUsedCamera: true
        });

        const cameraConfig = select.value
          ? { deviceId: { exact: select.value } }
          : { facingMode: "environment" };

        await scanner.start(
          cameraConfig,
          {
            fps: 10,
            qrbox: { width: 340, height: 220 },
            aspectRatio: 1.7778
          },
          async (decodedText, decodedResult) => {
            try {
              await scanner.stop();
              scanning = false;

              document.getElementById("start").disabled = false;
              document.getElementById("stop").disabled = true;

              render(decodedText, getFormatName(decodedResult));
            } catch {}
          },
          () => {}
        );

        scanning = true;
        document.getElementById("start").disabled = true;
        document.getElementById("stop").disabled = false;
      } catch (e) {
        alert("Start failed: " + (e?.message || e));
      }
    }

    async function stop() {
      try {
        if (scanner && scanning) {
          await scanner.stop();
          scanner.clear();
        }

        scanning = false;
        document.getElementById("start").disabled = false;
        document.getElementById("stop").disabled = true;
      } catch {}
    }

    function scanAgain() {
      document.getElementById("output").hidden = true;
      document.getElementById("reader").hidden = false;
      document.getElementById("controls").hidden = false;
      start();
    }

    document.getElementById("start").addEventListener("click", start);
    document.getElementById("stop").addEventListener("click", stop);
    document.getElementById("again").addEventListener("click", scanAgain);
  </script>
</body>
</html>
