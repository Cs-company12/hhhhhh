<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camera Photo Local Storage</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 16px;
    }

    h1 {
      font-size: 22px;
      margin: 8px 0 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #22c55e;
      color: #07130a;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #stopBtn {
      background: #ef4444;
      color: white;
    }

    #clearBtn {
      background: #f59e0b;
      color: #221100;
    }

    video {
      width: 100%;
      max-width: 700px;
      border-radius: 16px;
      background: black;
      display: block;
    }

    canvas {
      display: none;
    }

    .status {
      margin: 12px 0;
      color: #93c5fd;
      font-weight: 600;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    .card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 10px;
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      display: block;
      background: white;
    }

    .small {
      font-size: 12px;
      color: #cbd5e1;
      margin: 8px 0;
      word-break: break-word;
    }

    .card button {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      font-size: 14px;
    }

    .downloadBtn {
      background: #3b82f6;
      color: white;
    }

    .deleteBtn {
      background: #ef4444;
      color: white;
    }
  </style>
</head>

<body>
  <h1>Camera Photo → localStorage</h1>

  <div class="controls">
    <button id="startBtn">Start Camera</button>
    <button id="captureBtn" disabled>Take Photo</button>
    <button id="stopBtn" disabled>Stop Camera</button>
    <button id="clearBtn">Clear Saved Photos</button>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="status" id="status">Camera is off.</div>

  <h2>Saved Photos</h2>
  <div class="gallery" id="gallery"></div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const startBtn = document.getElementById("startBtn");
    const captureBtn = document.getElementById("captureBtn");
    const stopBtn = document.getElementById("stopBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusText = document.getElementById("status");
    const gallery = document.getElementById("gallery");

    const STORAGE_KEY = "savedCameraPhotos";

    let stream = null;

    function setStatus(message) {
      statusText.textContent = message;
    }

    function getSavedPhotos() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const photos = JSON.parse(raw || "[]");
        return Array.isArray(photos) ? photos : [];
      } catch {
        return [];
      }
    }

    function savePhotosToStorage(photos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
    }

    function renderGallery() {
      gallery.innerHTML = "";

      const photos = getSavedPhotos();

      if (!photos.length) {
        gallery.innerHTML = "<p>No saved photos yet.</p>";
        return;
      }

      photos.forEach(photo => {
        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");
        img.src = photo.dataUrl;

        const date = document.createElement("div");
        date.className = "small";
        date.textContent = new Date(photo.createdAt).toLocaleString();

        const downloadButton = document.createElement("button");
        downloadButton.className = "downloadBtn";
        downloadButton.textContent = "Download";
        downloadButton.onclick = () => {
          const link = document.createElement("a");
          link.href = photo.dataUrl;
          link.download = `photo-${photo.id}.jpg`;
          link.click();
        };

        const deleteButton = document.createElement("button");
        deleteButton.className = "deleteBtn";
        deleteButton.textContent = "Delete";
        deleteButton.onclick = () => {
          const remaining = getSavedPhotos().filter(p => p.id !== photo.id);
          savePhotosToStorage(remaining);
          renderGallery();
          setStatus("Photo deleted from localStorage.");
        };

        card.appendChild(img);
        card.appendChild(date);
        card.appendChild(downloadButton);
        card.appendChild(deleteButton);

        gallery.appendChild(card);
      });
    }

    async function startCamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("Camera is not supported here. Use Chrome/Edge/Safari on HTTPS or localhost.");
          return;
        }

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        video.srcObject = stream;

        await video.play();

        startBtn.disabled = true;
        captureBtn.disabled = false;
        stopBtn.disabled = false;

        setStatus("Camera is running.");
      } catch (error) {
        console.error(error);
        alert("Camera start failed: " + error.name + " - " + error.message);
        setStatus("Camera failed to start.");
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;

      startBtn.disabled = false;
      captureBtn.disabled = true;
      stopBtn.disabled = true;

      setStatus("Camera is off.");
    }

    function capturePhoto() {
      if (!stream || !video.videoWidth) {
        alert("Camera is not ready yet.");
        return;
      }

      // Resize image so localStorage does not fill up too quickly.
      const maxWidth = 1280;
      const scale = Math.min(1, maxWidth / video.videoWidth);

      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);

      const context = canvas.getContext("2d");
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const dataUrl = canvas.toDataURL("image/jpeg", 0.82);

      const photos = getSavedPhotos();

      photos.unshift({
        id: Date.now(),
        createdAt: new Date().toISOString(),
        dataUrl: dataUrl
      });

      try {
        savePhotosToStorage(photos);
        renderGallery();
        setStatus("Photo saved to localStorage.");
      } catch (error) {
        console.error(error);
        alert("localStorage is full. Delete some photos or use IndexedDB for larger storage.");
      }
    }

    function clearSavedPhotos() {
      const ok = confirm("Delete all saved photos from localStorage?");
      if (!ok) return;

      localStorage.removeItem(STORAGE_KEY);
      renderGallery();
      setStatus("All saved photos were deleted.");
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
    captureBtn.addEventListener("click", capturePhoto);
    clearBtn.addEventListener("click", clearSavedPhotos);

    // Initial render
    renderGallery();
  </script>
</body>
</html>
