<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camera API Card Scanner</title>

  <!-- Barcode generator for displaying the digital visual code -->
  <script src="https://cdn.jsdelivr.net/npm/bwip-js@4.5.1/dist/bwip-js-min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .warning {
      color: #fca5a5;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #22c55e;
      color: #07130a;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #stopBtn {
      background: #ef4444;
      color: white;
    }

    #clearBtn {
      background: #f59e0b;
      color: #221100;
    }

    .danger {
      background: #ef4444;
      color: white;
    }

    video {
      width: 100%;
      max-width: 720px;
      border-radius: 16px;
      background: black;
      display: block;
    }

    #status {
      margin: 12px 0;
      color: #93c5fd;
      font-weight: 600;
      word-break: break-word;
    }

    h2 {
      margin-top: 28px;
      font-size: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 10px;
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      display: block;
      background: white;
    }

    .codeCanvas {
      width: 100%;
      border-radius: 12px;
      margin-top: 10px;
      background: white;
    }

    .small {
      font-size: 12px;
      color: #cbd5e1;
      margin: 8px 0;
      word-break: break-word;
    }

    .btnRow {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .btnRow button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>Camera API Card Scanner</h1>

  <div class="warning">
    Works for visual barcode/QR cards only. It cannot clone NFC, RFID, payment,
    magnetic stripe, hotel key, transit, or secure access cards.
  </div>

  <div class="controls">
    <button id="startBtn">Start Camera</button>
    <button id="stopBtn" disabled>Stop Camera</button>
    <button id="photoBtn" disabled>Save Photo Only</button>
    <button id="clearBtn">Clear Saved Scans</button>
  </div>

  <div id="status">Ready.</div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="frameCanvas" hidden></canvas>

  <h2>Saved Scans</h2>
  <div class="gallery" id="gallery"></div>

  <script>
    const video = document.getElementById("video");
    const frameCanvas = document.getElementById("frameCanvas");

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const photoBtn = document.getElementById("photoBtn");
    const clearBtn = document.getElementById("clearBtn");

    const statusEl = document.getElementById("status");
    const galleryEl = document.getElementById("gallery");

    let mediaStream = null;
    let scanTimer = null;
    let detector = null;

    let lastScan = {
      value: "",
      time: 0
    };

    const DB_NAME = "camera-card-scans";
    const DB_STORE = "scans";

    let dbPromise = null;

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function makeId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return Date.now().toString(36) + Math.random().toString(16).slice(2);
    }

    function getDB() {
      if (dbPromise) return dbPromise;

      dbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(DB_STORE)) {
            db.createObjectStore(DB_STORE, { keyPath: "id" });
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });

      return dbPromise;
    }

    async function addScan(record) {
      const db = await getDB();

      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        const store = tx.objectStore(DB_STORE);

        store.add(record);

        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getAllScans() {
      const db = await getDB();

      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readonly");
        const store = tx.objectStore(DB_STORE);
        const request = store.getAll();

        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
    }

    async function deleteScan(id) {
      const db = await getDB();

      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        const store = tx.objectStore(DB_STORE);

        store.delete(id);

        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function clearScans() {
      const db = await getDB();

      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        const store = tx.objectStore(DB_STORE);

        store.clear();

        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function initDetector() {
      if (!("BarcodeDetector" in window)) {
        detector = null;
        setStatus("BarcodeDetector API not supported. Photo capture only.");
        return;
      }

      try {
        const supportedFormats = await BarcodeDetector.getSupportedFormats();

        const wantedFormats = [
          "qr_code",
          "code_128",
          "code_39",
          "code_93",
          "ean_13",
          "ean_8",
          "upc_a",
          "upc_e",
          "data_matrix",
          "pdf417"
        ];

        const formats = supportedFormats.filter(format =>
          wantedFormats.includes(format)
        );

        detector = new BarcodeDetector(
          formats.length ? { formats } : undefined
        );

        setStatus("BarcodeDetector API ready.");
      } catch (error) {
        console.error(error);
        detector = null;
        setStatus("BarcodeDetector failed. Photo capture only.");
      }
    }

    function captureFrame(maxWidth = 1024) {
      if (!video.videoWidth || !video.videoHeight) {
        return null;
      }

      const scale = Math.min(1, maxWidth / video.videoWidth);

      frameCanvas.width = Math.round(video.videoWidth * scale);
      frameCanvas.height = Math.round(video.videoHeight * scale);

      const context = frameCanvas.getContext("2d");
      context.drawImage(video, 0, 0, frameCanvas.width, frameCanvas.height);

      return frameCanvas.toDataURL("image/jpeg", 0.82);
    }

    async function startCamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("Camera API not supported. Use HTTPS or localhost.");
          return;
        }

        await initDetector();

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        video.srcObject = mediaStream;
        await video.play();

        startBtn.disabled = true;
        stopBtn.disabled = false;
        photoBtn.disabled = false;

        setStatus(
          detector
            ? "Camera running. Scanning for barcode/QR..."
            : "Camera running. Barcode detection unavailable."
        );

        if (detector) {
          scanTimer = setInterval(scanFrame, 500);
        }
      } catch (error) {
        console.error(error);
        alert("Camera start failed: " + error.name + " - " + error.message);
      }
    }

    function stopCamera() {
      if (scanTimer) {
        clearInterval(scanTimer);
        scanTimer = null;
      }

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }

      video.srcObject = null;

      startBtn.disabled = false;
      stopBtn.disabled = true;
      photoBtn.disabled = true;

      setStatus("Camera stopped.");
    }

    async function scanFrame() {
      if (!detector || video.readyState < 2) return;

      try {
        const barcodes = await detector.detect(video);

        if (!barcodes || !barcodes.length) return;

        const code = barcodes[0];
        const now = Date.now();

        // Prevent saving the same code repeatedly within 5 seconds.
        if (
          lastScan.value === code.rawValue &&
          now - lastScan.time < 5000
        ) {
          return;
        }

        lastScan = {
          value: code.rawValue,
          time: now
        };

        const photo = captureFrame(1024);

        const record = {
          id: makeId(),
          createdAt: new Date().toISOString(),
          kind: "barcode",
          format: code.format,
          value: code.rawValue,
          photo: photo
        };

        await addScan(record);
        await renderGallery();

        setStatus(`Saved: ${code.format} -> ${code.rawValue}`);
      } catch (error) {
        console.error(error);
      }
    }

    async function savePhotoOnly() {
      const photo = captureFrame(1280);

      if (!photo) {
        alert("Camera is not ready.");
        return;
      }

      const record = {
        id: makeId(),
        createdAt: new Date().toISOString(),
        kind: "photo",
        format: null,
        value: null,
        photo: photo
      };

      await addScan(record);
      await renderGallery();

      setStatus("Photo saved locally.");
    }

    function formatToBcid(format) {
      const map = {
        qr_code: "qrcode",
        code_128: "code128",
        code_39: "code39",
        code_93: "code93",
        ean_13: "ean13",
        ean_8: "ean8",
        upc_a: "upca",
        upc_e: "upce",
        data_matrix: "datamatrix",
        pdf417: "pdf417"
      };

      return map[format] || null;
    }

    function drawDigitalCode(canvas, record) {
      if (!record.value || typeof bwipjs === "undefined") {
        return false;
      }

      let bcid = formatToBcid(record.format);

      if (!bcid) {
        if (/^https?:/i.test(record.value)) {
          bcid = "qrcode";
        } else {
          bcid = "code128";
        }
      }

      try {
        const is2D = ["qrcode", "datamatrix", "pdf417"].includes(bcid);

        bwipjs.toCanvas(canvas, {
          bcid: bcid,
          text: record.value,
          scale: 3,
          backgroundcolor: "FFFFFF",
          padding: 8,
          includetext: !is2D,
          textxalign: "center"
        });

        return true;
      } catch (error) {
        console.error(error);
        return false;
      }
    }

    async function renderGallery() {
      const scans = await getAllScans();

      galleryEl.innerHTML = "";

      if (!scans.length) {
        galleryEl.innerHTML = "<p>No saved scans yet.</p>";
        return;
      }

      scans.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      for (const scan of scans) {
        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");
        img.src = scan.photo;

        const info = document.createElement("div");
        info.className = "small";
        info.textContent =
          scan.kind.toUpperCase() +
          " | " +
          (scan.format || "image") +
          " | " +
          new Date(scan.createdAt).toLocaleString();

        const value = document.createElement("div");
        value.className = "small";
        value.textContent = scan.value
          ? "Value: " + scan.value
          : "No decoded value.";

        const codeCanvas = document.createElement("canvas");
        codeCanvas.className = "codeCanvas";

        const codeDrawn = drawDigitalCode(codeCanvas, scan);

        if (!codeDrawn) {
          codeCanvas.style.display = "none";
        }

        const btnRow = document.createElement("div");
        btnRow.className = "btnRow";

        const downloadPhotoBtn = document.createElement("button");
        downloadPhotoBtn.textContent = "Download Photo";

        downloadPhotoBtn.onclick = () => {
          const link = document.createElement("a");
          link.href = scan.photo;
          link.download = `scan-${scan.id}.jpg`;
          link.click();
        };

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.className = "danger";

        deleteBtn.onclick = async () => {
          await deleteScan(scan.id);
          await renderGallery();
          setStatus("Scan deleted.");
        };

        btnRow.appendChild(downloadPhotoBtn);
        btnRow.appendChild(deleteBtn);

        card.appendChild(img);
        card.appendChild(info);
        card.appendChild(value);

        if (codeDrawn) {
          card.appendChild(codeCanvas);
        }

        card.appendChild(btnRow);

        galleryEl.appendChild(card);
      }
    }

    startBtn.onclick = startCamera;
    stopBtn.onclick = stopCamera;
    photoBtn.onclick = savePhotoOnly;

    clearBtn.onclick = async () => {
      const ok = confirm("Delete all saved scans?");
      if (!ok) return;

      await clearScans();
      await renderGallery();
      setStatus("All saved scans deleted.");
    };

    // Initial render
    renderGallery();
  </script>
</body>
</html>
