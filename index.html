<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electronic Card Generator</title>

<!-- html2canvas library si loo soo dejiyo sawirka card-ka -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    background: #0f172a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.wrapper{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

.card{
    width: 380px;
    height: 230px;
    border-radius: 20px;
    padding: 22px;
    color: white;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #071b35, #0b4260 50%, #081523);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.18);
}

/* Electronic futuristic lines */
.card::before,
.card::after{
    content: "";
    position: absolute;
    border: 1px solid rgba(0, 220, 255, 0.25);
    border-radius: 50%;
}

.card::before{
    width: 300px;
    height: 300px;
    right: -130px;
    top: -170px;
}

.card::after{
    width: 250px;
    height: 250px;
    left: -150px;
    bottom: -170px;
}

.header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 2;
}

.logo{
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(45deg, #00d2ff, #3a7bd5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.power{
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
}

.power-dot{
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 12px #00ff88;
    animation: pulse 1.2s infinite;
}

@keyframes pulse{
    0%, 100% {
        opacity: 1;
        transform: scale(1);
    }
    50%{
        opacity: 0.35;
        transform: scale(0.7);
    }
}

.chip{
    width: 48px;
    height: 36px;
    margin-top: 25px;
    border-radius: 7px;
    background: linear-gradient(135deg, #d6b45c, #fff1a8, #b88b27);
    position: relative;
    z-index: 2;
}

.chip::before,
.chip::after{
    content: "";
    position: absolute;
    background: #9b7824;
}

.chip::before{
    width: 100%;
    height: 1px;
    top: 18px;
}

.chip::after{
    width: 1px;
    height: 100%;
    left: 24px;
}

.info{
    position: absolute;
    left: 22px;
    bottom: 22px;
    z-index: 2;
    max-width: 250px;
}

.name{
    font-size: 16px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.id{
    margin-top: 5px;
    font-size: 12px;
    opacity: 0.85;
    letter-spacing: 2px;
    color: #00d2ff;
}

.qr{
    position: absolute;
    right: 22px;
    bottom: 22px;
    width: 65px;
    height: 65px;
    background: white;
    padding: 4px;
    border-radius: 6px;
    z-index: 3;
}

/* Controls Box */
.controls{
    background: #1e293b;
    padding: 24px;
    border-radius: 15px;
    width: 380px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.05);
}

.controls input{
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 12px;
    border: 1px solid #334155;
    border-radius: 8px;
    outline: none;
    background: #0f172a;
    color: white;
    font-size: 14px;
    transition: 0.3s;
}

.controls input:focus{
    border-color: #00a8ff;
}

.btn-group{
    display: flex;
    gap: 10px;
}

button{
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #00a8ff;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
}

button:hover{
    background: #008bd1;
}

button.download-btn{
    background: #10b981;
}

button.download-btn:hover{
    background: #059669;
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- CARD -->
    <div class="card" id="cardElement">
        <div class="header">
            <div class="logo">SMART CARD</div>
            <div class="power">
                <span class="power-dot"></span>
                POWER
            </div>
        </div>

        <div class="chip"></div>

        <div class="info">
            <div class="name" id="cardName">ISSE SHOOLE</div>
            <div class="id" id="cardId">ID: SC-2026-001</div>
        </div>

        <img
            id="qrCode"
            class="qr"
            src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=Name:%20ISSE%20SHOOLE%20|%20ID:%20SC-2026-001"
            alt="QR Code"
        >
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <input
            id="nameInput"
            type="text"
            placeholder="Geli magaca..."
            oninput="updateCard()"
        >

        <input
            id="idInput"
            type="text"
            placeholder="Geli Card ID..."
            oninput="updateCard()"
        >

        <div class="btn-group">
            <button onclick="updateCard()">SAMEE CARD</button>
            <button class="download-btn" onclick="downloadCard()">DOWNLOAD</button>
        </div>
    </div>

</div>

<script>
function updateCard() {
    let nameVal = document.getElementById("nameInput").value.trim();
    let idVal = document.getElementById("idInput").value.trim();

    // Qiimaha caadiga ah haddii la tirtiro meesha wax lagu qoro
    let name = nameVal ? nameVal : "ISSE SHOOLE";
    let id = idVal ? idVal : "SC-2026-001";

    // Qoraalada Card-ka oo la cusbooneysiiyo
    document.getElementById("cardName").textContent = name.toUpperCase();
    document.getElementById("cardId").textContent = "ID: " + id;

    // Cusbooneysiinta QR Code-ka
    let qrData = encodeURIComponent(`Name: ${name} | ID: ${id}`);
    document.getElementById("qrCode").src = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${qrData}`;
}

// Shaqada lagu soo dejisanayo Card-ka oo sawir ah
function downloadCard() {
    const cardElement = document.getElementById('cardElement');
    
    html2canvas(cardElement, {
        scale: 2, // Sawir tayo sare leh
        backgroundColor: null
    }).then(canvas => {
        let link = document.createElement('a');
        link.download = 'smart-card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
</script>

</body>
</html>
